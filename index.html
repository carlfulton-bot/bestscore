<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#071018">
<title>BestScore</title>
<style>
  :root {
    --bg: #071018;
    --surface: #0f1c2e;
    --surface2: #16283d;
    --accent: #3b82f6;
    --us: #22c55e;
    --them: #f43f5e;
    --text: #e2e8f0;
    --dim: #94a3b8;
    --border: #1e3a5f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: env(safe-area-inset-top) 16px 16px;
    max-width: 480px;
    margin: 0 auto;
  }
  header { text-align: center; padding: 16px 0 8px; }
  header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
  header p { color: var(--dim); font-size: 0.85rem; margin-top: 2px; }

  .teams { display: flex; gap: 8px; margin: 12px 0; }
  .teams input {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 10px 12px; border-radius: 10px; font-size: 1rem;
  }

  .scoreboard {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px;
    align-items: center; background: var(--surface); border-radius: 16px;
    padding: 20px 12px; margin-bottom: 12px; border: 1px solid var(--border);
  }
  .side { text-align: center; }
  .side .name { font-size: 0.8rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
  .score { font-size: 3.6rem; font-weight: 800; line-height: 1; }
  .us .score { color: var(--us); }
  .them .score { color: var(--them); }
  .sets { font-size: 0.85rem; color: var(--dim); margin-top: 6px; }
  .divider { font-size: 1.4rem; color: var(--dim); font-weight: 600; }

  .serving {
    text-align: center; background: var(--surface2); padding: 8px;
    border-radius: 10px; margin-bottom: 12px; font-size: 0.9rem; color: var(--dim);
  }
  .serving strong { color: var(--accent); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .btn {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    padding: 16px 8px; border-radius: 12px; font-size: 1.05rem; font-weight: 600;
    cursor: pointer; transition: all 0.12s;
  }
  .btn:active { transform: scale(0.97); }
  .btn.us { background: #14532d; border-color: #166534; }
  .btn.them { background: #881337; border-color: #9f1239; }
  .btn.full { grid-column: span 2; }
  .btn.sm { padding: 12px; font-size: 0.9rem; font-weight: 500; }

  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .row .btn { flex: 1; }

  .history {
    background: var(--surface); border-radius: 12px; padding: 12px;
    margin-top: 12px; max-height: 160px; overflow-y: auto; font-size: 0.8rem;
    color: var(--dim); border: 1px solid var(--border);
  }
  .history div { padding: 3px 0; border-bottom: 1px solid #1e3a5f; }
  .history div:last-child { border: none; }

  .footer { display: flex; gap: 8px; margin-top: 16px; }
  .footer .btn { flex: 1; font-size: 0.85rem; padding: 12px; }

  .modal-bg {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  .modal {
    background: var(--surface); padding: 20px; border-radius: 16px; width: 100%;
    max-width: 340px; border: 1px solid var(--border);
  }
  .modal h3 { margin-bottom: 8px; }
  .modal p { color: var(--dim); margin-bottom: 16px; font-size: 0.9rem; }
</style>
</head>
<body>
  <header>
    <h1>BestScore</h1>
    <p>Simple volleyball scoring</p>
  </header>

  <div class="teams">
    <input id="usName" value="Us" placeholder="Our team">
    <input id="themName" value="Them" placeholder="Opponent">
  </div>

  <div class="scoreboard">
    <div class="side us">
      <div class="name" id="usLabel">Us</div>
      <div class="score" id="usScore">0</div>
      <div class="sets" id="usSets">0 sets</div>
    </div>
    <div class="divider">–</div>
    <div class="side them">
      <div class="name" id="themLabel">Them</div>
      <div class="score" id="themScore">0</div>
      <div class="sets" id="themSets">0 sets</div>
    </div>
  </div>

  <div class="serving" id="serving">Serving: <strong>Us</strong></div>

  <div class="grid">
    <button class="btn us" onclick="point('us')">+1 Us</button>
    <button class="btn them" onclick="point('them')">+1 Them</button>
  </div>

  <div class="row">
    <button class="btn sm" onclick="serve('ace')">Ace</button>
    <button class="btn sm" onclick="serve('in-us')">In · Us</button>
    <button class="btn sm" onclick="serve('in-them')">In · Them</button>
    <button class="btn sm" onclick="serve('error')">Error</button>
  </div>

  <div class="row">
    <button class="btn sm" onclick="rotate()">Rotate</button>
    <button class="btn sm" onclick="undo()">Undo</button>
  </div>

  <div class="footer">
    <button class="btn sm" onclick="endSet()">End Set</button>
    <button class="btn sm" onclick="endMatch()">End Match</button>
    <button class="btn sm" onclick="reset()">Reset</button>
  </div>

  <div class="history" id="history"></div>

  <div class="modal-bg" id="modal">
    <div class="modal">
      <h3 id="modalTitle">Confirm</h3>
      <p id="modalText"></p>
      <div class="row">
        <button class="btn sm" onclick="closeModal()">Cancel</button>
        <button class="btn sm us" id="modalOk">OK</button>
      </div>
    </div>
  </div>

<script>
const state = {
  us: 0, them: 0, usSets: 0, themSets: 0,
  serving: 'us', history: []
};

function load() {
  try {
    const s = JSON.parse(localStorage.getItem('bestscore') || '{}');
    Object.assign(state, s);
    if (s.usName) document.getElementById('usName').value = s.usName;
    if (s.themName) document.getElementById('themName').value = s.themName;
  } catch {}
  render();
}

function save() {
  state.usName = document.getElementById('usName').value || 'Us';
  state.themName = document.getElementById('themName').value || 'Them';
  localStorage.setItem('bestscore', JSON.stringify(state));
}

function render() {
  const us = document.getElementById('usName').value || 'Us';
  const them = document.getElementById('themName').value || 'Them';
  document.getElementById('usLabel').textContent = us;
  document.getElementById('themLabel').textContent = them;
  document.getElementById('usScore').textContent = state.us;
  document.getElementById('themScore').textContent = state.them;
  document.getElementById('usSets').textContent = state.usSets + ' set' + (state.usSets !== 1 ? 's' : '');
  document.getElementById('themSets').textContent = state.themSets + ' set' + (state.themSets !== 1 ? 's' : '');
  const srv = state.serving === 'us' ? us : them;
  document.getElementById('serving').innerHTML = 'Serving: <strong>' + srv + '</strong>';
  const h = document.getElementById('history');
  h.innerHTML = state.history.slice().reverse().map(x => '<div>' + x + '</div>').join('') || '<div>No points yet</div>';
}

function log(msg) {
  state.history.push(msg);
  if (state.history.length > 40) state.history.shift();
}

function point(side) {
  if (side === 'us') { state.us++; log('+1 ' + (document.getElementById('usName').value || 'Us')); }
  else { state.them++; log('+1 ' + (document.getElementById('themName').value || 'Them')); }
  // Side-out: if non-serving team scores, they get serve
  if ((side === 'us' && state.serving !== 'us') || (side === 'them' && state.serving !== 'them')) {
    state.serving = side;
  }
  save(); render();
}

function serve(type) {
  const us = document.getElementById('usName').value || 'Us';
  const them = document.getElementById('themName').value || 'Them';
  if (type === 'ace') { state.us++; log('Ace'); }
  else if (type === 'in-us') { state.us++; log('In · Us'); }
  else if (type === 'in-them') { state.them++; log('In · Them'); state.serving = 'them'; }
  else if (type === 'error') { state.them++; log('Error'); state.serving = 'them'; }
  save(); render();
}

function rotate() {
  state.serving = state.serving === 'us' ? 'them' : 'us';
  log('Rotate → ' + (state.serving === 'us' ? 'Us' : 'Them'));
  save(); render();
}

function undo() {
  if (!state.history.length) return;
  const last = state.history.pop();
  if (last.includes('+1 Us') || last.includes('Ace') || last.includes('In · Us')) {
    if (state.us > 0) state.us--;
  } else if (last.includes('+1 Them') || last.includes('In · Them') || last.includes('Error')) {
    if (state.them > 0) state.them--;
  }
  log('Undo');
  save(); render();
}

function endSet() {
  showModal('End Set', 'Give this set to the leader and start next set at 0-0?', () => {
    if (state.us > state.them) state.usSets++;
    else if (state.them > state.us) state.themSets++;
    state.us = 0; state.them = 0;
    log('Set ended · ' + state.usSets + '-' + state.themSets);
    save(); render(); closeModal();
  });
}

function endMatch() {
  showModal('End Match', 'Finish match and clear scores?', () => {
    log('Match ended · Sets ' + state.usSets + '-' + state.themSets);
    state.us = state.them = state.usSets = state.themSets = 0;
    state.serving = 'us'; state.history = [];
    save(); render(); closeModal();
  });
}

function reset() {
  showModal('Reset', 'Clear everything?', () => {
    Object.assign(state, { us:0, them:0, usSets:0, themSets:0, serving:'us', history:[] });
    localStorage.removeItem('bestscore');
    render(); closeModal();
  });
}

function showModal(title, text, ok) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modalOk').onclick = ok;
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; }

['usName','themName'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => { save(); render(); });
});

load();
</script>
</body>
</html>
